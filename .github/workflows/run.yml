name: Run Bot Parallel 24/7

on:
  workflow_dispatch:
  schedule:
    # Jalan otomatis tiap 6 jam 5 menit (Menit ke-5 di jam 00, 06, 12, 18 UTC)
    - cron: '5 0,6,12,18 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ['akun-1_2', 'akun-1_3', 'akun-1_4', 'akun-1_5', 'akun-1_6', 'akun-1b']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }}
      run: python download_drive.py

    - name: Run Bot Script
      run: |
        cd akun-1/${{ matrix.folder }}
        python3 seofast_zhp.py
