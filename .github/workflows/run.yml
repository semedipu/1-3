name: "sf1m"

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0,6,12,18 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['1', '2', '3']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FILE_ID }}
      run: python download_drive.py

    - name: Run All Subfolder Bots In Parallel
      run: |
        python -c "
        import os, subprocess

        target = '${{ matrix.target }}'
        processes = []

        if os.path.exists(target):
            for root, dirs, files in os.walk(target):
                if 'seofast_zhp.py' in files:
                    print(f'==> Jalankan Loop Bot: {root}')
                    p = subprocess.Popen(['python3', 'seofast_zhp.py'], cwd=root)
                    processes.append(p)

            for p in processes:
                p.wait()
        else:
            print(f'Folder {target} tidak ditemukan!')
        "
