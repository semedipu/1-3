name: "sf1m"

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0,6,12,18 * * *'

jobs:
  # JOB 1: Khusus Cek Spesifikasi Runner secara terpisah
  cek-spek:
    runs-on: ubuntu-latest
    steps:
    - name: Cek Spesifikasi & Resource Runner
      run: |
        echo "=== CPU Info ==="
        nproc
        lscpu | grep "Model name\|CPU(s):"
        echo "=== RAM Info ==="
        free -h
        echo "=== Disk Info ==="
        df -h /

  # JOB 2: Eksekusi Bot
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.target }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        target: ['1', '2', '3']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FILE_ID }}
        TARGET_ACCOUNT: ${{ matrix.target }}
      run: python download_drive.py

    - name: Run All Subfolder Bots In Parallel with Individual Auto-Restart
      run: |
        python3 -c "
        import os, subprocess

        target = '${{ matrix.target }}'
        processes = []

        def run_bot_loop(bot_dir):
            cmd = f'until python3 seofast_zhp.py; do echo \"[!] Bot di {bot_dir} terhenti. Restart dalam 5s...\"; sleep 5; done'
            return subprocess.Popen(cmd, shell=True, cwd=bot_dir, executable='/bin/bash')

        if os.path.exists(target):
            for root, dirs, files in os.walk(target):
                if 'seofast_zhp.py' in files:
                    print(f'==> Menjalankan Bot dengan Auto-Restart di: {root}')
                    p = run_bot_loop(root)
                    processes.append(p)

            for p in processes:
                p.wait()
        else:
            print(f'[!] ERROR: Folder {target} tidak ditemukan!')
            exit(1)
        "
